<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMago - Descobra Sua Linguagem Mágica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <h1>⚡ TOMOS MÁGICOS ⚡</h1>
            <p class="subtitle">CONHECIMENTO É PODER</p>
        </header>

        <!-- Quiz Container -->
        <div class="quiz-container">
            <!-- Tela de Início -->
            <div id="welcome-screen" class="screen active">
                <div class="welcome-content">
                    <div class="crystal"></div>
                    <h2>Bem-vindo, Aprendiz de Mago</h2>
                    <p>Descubra qual linguagem de programação combina com seu estilo de magia!</p>
                    <p class="info-text">Responda às perguntas do oráculo e deixe a magia revelar seu caminho...</p>
                    <button class="btn btn-primary" onclick="startQuiz()">INICIAR JORNADA</button>
                </div>
            </div>

            <!-- Perguntas do Quiz -->
            <div id="quiz-screen" class="screen">
                <div class="quiz-header">
                    <div class="progress-bar">
                        <div id="progress" class="progress-fill"></div>
                    </div>
                    <p id="question-counter"></p>
                </div>
                
                <div class="question-container">
                    <h3 id="question-text"></h3>
                    <div id="options-container" class="options-grid"></div>
                </div>

                <div class="quiz-footer">
                    <button class="btn btn-secondary" onclick="previousQuestion()" id="prev-btn">← ANTERIOR</button>
                    <button class="btn btn-secondary" onclick="nextQuestion()" id="next-btn">PRÓXIMA →</button>
                </div>
            </div>

            <!-- Tela de Resultado -->
            <div id="result-screen" class="screen">
                <div class="result-content">
                    <div class="result-header">
                        <h2>✨ SEU TOMO MÁGICO ✨</h2>
                    </div>
                    
                    <div id="result-book" class="magical-book">
                        <div class="book-spine"></div>
                        <div class="book-cover">
                            <div class="book-title-result" id="language-title"></div>
                            <div class="book-level" id="language-level"></div>
                        </div>
                    </div>

                    <div id="result-description" class="result-description"></div>

                    <div class="skills-section">
                        <h3>⚡ Poderes Especiais:</h3>
                        <ul id="skills-list"></ul>
                    </div>

                    <div class="recommendation-section">
                        <h3>📜 Recomendação do Oráculo:</h3>
                        <p id="recommendation"></p>
                    </div>

                    <div class="result-buttons">
                        <button class="btn btn-primary" onclick="restartQuiz()">TENTAR NOVAMENTE</button>
                        <button class="btn btn-secondary" onclick="shareResult()">COMPARTILHAR RESULTADO</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
